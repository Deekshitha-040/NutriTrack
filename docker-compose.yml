services:
  nutritrack:
    build: .
    container_name: nutritrack-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/nutritrack.db
      SECRET_KEY: ${SECRET_KEY:-replace-this-before-deployment}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nutritrack.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisAdminPassword123!}
    volumes:
      - nutritrack_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  nutritrack_data:
